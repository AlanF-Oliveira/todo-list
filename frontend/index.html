<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <form id="form-global">
        <div class="container">
            <input type="hidden" id="todo-id">
            <h1 class="mb-4 text-center">TODO LIST</h1>
            <div class="mb-3">
                <label for="name" class="form-label">Nome</label>
                <input type="text" class="form-control" id="name" placeholder="Tarefa" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Descrição</label>
                <textarea class="form-control" id="description"></textarea required>
            </div>
            <div class="row">
                <div class="col-md-7 mb-3">
                    <label for="date" class="form-label">Data</label>
                    <input type="date" class="form-control" id="date" required>
                </div>
                <div class="col-md-5 mb-3">
                    <label for="time" class="form-label">Horário</label>
                    <input type="time" class="form-control" id="time" required>
                </div>
            </div>
            <div class="mb-3">
                <label for="priority" class="form-label">Prioridade</label>
                <select class="form-select" id="priority" required>
                    <option selected disabled>Selecione a prioridade</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="category" class="form-label">Categoria</label>
                <input type="text" class="form-control" id="category" placeholder="Ex: Estudos, Trabalho..." required>
            </div>
            <div class="mb-3">
                <label for="status" class="form-label">Status</label>
                <select class="form-select" id="status" required>
                    <option selected disabled>Selecione o status</option>
                    <option value="TODO">TODO</option>
                    <option value="DOING">DOING</option>
                    <option value="DONE">DONE</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="alarmHours" class="form-label">Avisar quantas horas antes</label>
                <input type="number" class="form-control" id="alarmHours" min="0" placeholder="Ex: 2">
            </div>
            <button type="submit" class="btn btn-primary" id="btn-save" >
                Criar tarefa
            </button>
            <button type="button" class="btn btn-secondary" id="btn-cancel" hidden>
                Cancelar
            </button>
            <hr class="my-4">
            <div id="todo-list">
            </div>
            
        </div>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
</body>

</html>
